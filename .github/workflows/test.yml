name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # 모든 run 단계의 기본 작업 디렉토리를 mission9-10-11로 지정
    defaults:
      run:
        working-directory: mission9-10-11

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mission_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mission_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mission_test
      NODE_ENV: test
      JWT_ACCESS_TOKEN_SECRET: test-secret
      JWT_REFRESH_TOKEN_SECRET: test-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: mission9-10-11/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create CI .env.test
        # CI 전용 .env.test 생성 (로컬/운영 비밀값과 분리)
        run: |
          echo 'DATABASE_URL="postgresql://postgres:postgres@localhost:5432/mission_test"' > .env.test

      - name: Type Check
        run: npm run typecheck

      - name: Run Tests
        run: npm run test
